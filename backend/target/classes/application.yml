server:
  port: 8080

spring:
  application:
    name: globetrotter-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/globetrotter_db}
    username: ${SPRING_DATASOURCE_USERNAME:aryan}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    com.globetrotter: DEBUG
    org.hibernate.SQL: DEBUG

springdoc:
  packages-to-scan: com.globetrotter.controller
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

